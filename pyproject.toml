[project]
name = "voice-disclosure-study"
version = "1.0.0"
description = "Conversational interview study: does the interviewer's voice change what people disclose?"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["gateway/migrations", "rasa/.rasa", "rasa/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF012", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "interview", "disclosure_analysis", "actions"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"**/conftest.py" = ["S105"]
"analysis/disclosure_analysis/simulate.py" = ["S311"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
