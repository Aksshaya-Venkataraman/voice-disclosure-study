version: 2
updates:
  - package-ecosystem: pip
    directories: ["/gateway", "/analysis", "/"]
    # rasa/ is excluded: Rasa Open Source 3.6 pins its dependencies tightly and
    # rasa/overrides.txt holds the newest versions that still work with it
    # (newer ones break TensorFlow 2.12 or Rasa's pkg_resources import).
    # Advisories there are reviewed by hand (rasa/audit-exceptions.txt).
    exclude-paths: ["rasa/**"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/gateway", "/rasa"]
    schedule: { interval: weekly }
    ignore:
      # Rasa 3.6 needs Python 3.10, which only Ubuntu 22.04 ships with security support.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
