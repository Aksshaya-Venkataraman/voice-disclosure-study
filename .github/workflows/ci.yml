name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint, SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Bandit (static security analysis)
        run: bandit -c pyproject.toml -r gateway/gateway analysis/disclosure_analysis interview rasa/actions scripts
      - name: pip-audit - gateway, analysis and dev tools (must be clean)
        run: |
          pip-audit -r gateway/requirements.txt --disable-pip --no-deps
          pip-audit -r analysis/requirements.txt --disable-pip --no-deps
          pip-audit -r requirements-dev.txt --disable-pip --no-deps
      - name: pip-audit - Rasa images (fails on any advisory not reviewed in rasa/audit-exceptions.txt)
        run: |
          ignore=$(grep -v -e '^#' -e '^$' rasa/audit-exceptions.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r rasa/requirements.txt --disable-pip --no-deps $ignore
          pip-audit -r rasa/actions/requirements.txt --disable-pip --no-deps $ignore

  secret-scan:
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Gateway and analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Gateway (API, security, interview flow)
        working-directory: gateway
        run: pytest --cov --cov-report=term-missing
      - name: Analysis (features, statistics, report)
        working-directory: analysis
        run: pytest
      - name: Analysis CLI on synthetic data
        working-directory: analysis
        env:
          PYTHONPATH: ".:.."
        run: |
          python -m disclosure_analysis.simulate --participants 24 --out /tmp/synthetic.csv
          python -m disclosure_analysis.report /tmp/synthetic.csv --out /tmp/report
          head -20 /tmp/report/report.md

  postgres-migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway database that only exists for this job, reachable on the runner only.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: voice_study
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/voice_study
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r gateway/requirements.txt
      - working-directory: gateway
        env:
          PYTHONPATH: ".:.."
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    name: Docker images and end-to-end HTTPS smoke test
    runs-on: ubuntu-latest
    needs: [lint-and-audit, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          tags: voice-disclosure-gateway:local
          load: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Build Rasa image (validates the data, trains the model and runs `rasa test core`)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rasa/Dockerfile
          target: server
          tags: voice-disclosure-rasa:local
          load: true
          cache-from: type=gha,scope=rasa
          cache-to: type=gha,mode=max,scope=rasa
      - name: Build action server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rasa/Dockerfile
          target: actions
          tags: voice-disclosure-actions:local
          load: true
          cache-from: type=gha,scope=actions
          cache-to: type=gha,mode=max,scope=actions
      - name: Generate throwaway secrets
        run: python3 scripts/generate_env.py --domain localhost --contact ci@example.org
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Fetch Caddy's local root CA (TLS is verified, never skipped)
        run: docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt ./caddy-root.crt
      - name: End-to-end interview through Caddy, gateway, Rasa, actions and PostgreSQL
        run: |
          token=$(grep '^RESEARCHER_TOKEN=' .env | cut -d= -f2-)
          python3 scripts/smoke_test.py --base https://localhost --ca caddy-root.crt --token "$token"
      - name: Rasa answered every turn (no scripted fallback)
        run: |
          if docker compose logs gateway | grep -q "rasa turn failed"; then
            echo "the gateway fell back to the scripted engine"; exit 1
          fi
      - name: Internal services are not reachable from the host
        run: |
          for port in 5005 5055 5432 8000; do
            if curl -s --max-time 3 "http://127.0.0.1:$port/" > /dev/null; then echo "port $port is exposed"; exit 1; fi
          done
      - name: Application containers run as non-root
        run: |
          for service in gateway rasa actions; do
            uid=$(docker compose exec -T "$service" id -u)
            echo "$service uid=$uid"; test "$uid" != "0"
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
